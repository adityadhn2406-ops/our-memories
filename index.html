  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // ─── INDEXEDDB STORAGE (Instant & Persistent) ─────────────────
    const DB_NAME = 'US_Memories_DB';
    const DB_VERSION = 1;

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('episodes')) {
            db.createObjectStore('episodes', { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains('settings')) {
            db.createObjectStore('settings', { keyPath: 'key' });
          }
          if (!db.objectStoreNames.contains('media_files')) {
            db.createObjectStore('media_files', { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function generateVideoThumbnail(fileOrBlobOrUrl) {
      return new Promise((resolve) => {
        try {
          const video = document.createElement('video');
          video.muted = true;
          video.playsInline = true;
          video.crossOrigin = 'anonymous';
          const tempUrl = typeof fileOrBlobOrUrl === 'string' ? fileOrBlobOrUrl : URL.createObjectURL(fileOrBlobOrUrl);
          video.src = tempUrl;
          video.currentTime = 0.5;

          video.onloadeddata = () => {
            video.currentTime = Math.min(1.0, (video.duration || 2) / 2);
          };

          video.onseeked = () => {
            try {
              const canvas = document.createElement('canvas');
              canvas.width = Math.min(640, video.videoWidth || 640);
              canvas.height = Math.round(canvas.width * (video.videoHeight || 360) / (video.videoWidth || 640));
              const ctx = canvas.getContext('2d');
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
              const thumb = canvas.toDataURL('image/jpeg', 0.85);
              if (typeof fileOrBlobOrUrl !== 'string') URL.revokeObjectURL(tempUrl);
              resolve(thumb);
            } catch (e) {
              resolve('');
            }
          };

          video.onerror = () => resolve('');
          setTimeout(() => resolve(''), 3500);
        } catch (e) {
          resolve('');
        }
      });
    }

    async function idbSaveMediaBlob(id, file) {
      try {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('media_files', 'readwrite');
          const store = tx.objectStore('media_files');
          tx.oncomplete = () => resolve(id);
          tx.onerror = () => reject(tx.error);
          store.put({ id, file, name: file.name, type: file.type });
        });
      } catch (e) {
        console.warn('idbSaveMediaBlob error:', e);
        return id;
      }
    }

    async function idbGetMediaBlob(id) {
      try {
        const db = await openDB();
        return new Promise((resolve) => {
          const tx = db.transaction('media_files', 'readonly');
          const store = tx.objectStore('media_files');
          const req = store.get(id);
          req.onsuccess = () => resolve(req.result ? req.result.file : null);
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        return null;
      }
    }

    async function idbGetEpisodeById(id) {
      try {
        const db = await openDB();
        return new Promise((resolve) => {
          const tx = db.transaction('episodes', 'readonly');
          const store = tx.objectStore('episodes');
          const req = store.get(id);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        return null;
      }
    }

    async function idbGetEpisodes() {
      try {
        const db = await openDB();
        return new Promise((resolve) => {
          const tx = db.transaction('episodes', 'readonly');
          const store = tx.objectStore('episodes');
          const req = store.getAll();
          req.onsuccess = async () => {
            const rawEps = req.result || [];
            for (const ep of rawEps) {
              if (ep.thumbBlobId) {
                const blob = await idbGetMediaBlob(ep.thumbBlobId);
                if (blob) ep.thumbnail = URL.createObjectURL(blob);
              }
              if (ep.media && Array.isArray(ep.media)) {
                for (const m of ep.media) {
                  if (m.blobId) {
                    const blob = await idbGetMediaBlob(m.blobId);
                    if (blob) m.url = URL.createObjectURL(blob);
                  }
                  if (!m.url && m.name) {
                    m.url = 'media/' + m.name;
                  }
                }
              }
            }
            resolve(rawEps);
          };
          req.onerror = () => resolve([]);
        });
      } catch (e) {
        return [];
      }
    }

    async function idbSaveEpisode(ep) {
      try {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('episodes', 'readwrite');
          const store = tx.objectStore('episodes');
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
          const epToSave = {
            ...ep,
            thumbnail: ep.thumbnail || '',
            thumbBlobId: ep.thumbBlobId || null,
            media: (ep.media || []).map(m => ({
              type: m.type,
              blobId: m.blobId || null,
              url: m.blobId ? '' : (m.url || ''),
              caption: m.caption || '',
              name: m.name || m._name || ''
            }))
          };
          store.put(epToSave);
        });
      } catch (e) {
        console.error('idbSaveEpisode error:', e);
      }
    }

    async function idbDeleteEpisode(id) {
      try {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('episodes', 'readwrite');
          const store = tx.objectStore('episodes');
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
          store.delete(id);
        });
      } catch (e) {
        console.error('idbDeleteEpisode error:', e);
      }
    }

    async function idbGetSettings() {
      try {
        const db = await openDB();
        return new Promise((resolve) => {
          const tx = db.transaction('settings', 'readonly');
          const store = tx.objectStore('settings');
          const req = store.get('config');
          req.onsuccess = () => resolve(req.result ? req.result.data : null);
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        return null;
      }
    }

    async function idbSaveSettings(settings) {
      try {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('settings', 'readwrite');
          const store = tx.objectStore('settings');
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
          store.put({ key: 'config', data: settings });
        });
      } catch (e) {
        console.error('idbSaveSettings error:', e);
      }
    }

    // ─── CLOUDINARY PERMANENT MEDIA STORAGE ───────────────────────
    const CLOUDINARY_CLOUD_NAME = 'qv0plfod';
    const CLOUDINARY_UPLOAD_PRESET = 'us_memories';
    const CLOUDINARY_API_URL = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`;

    const MAX_IMAGE_SIZE_BYTES = 10 * 1024 * 1024; // 10 MB
    const MAX_VIDEO_SIZE_BYTES = 100 * 1024 * 1024; // 100 MB

    function uploadFileToCloudinary(file, onProgress) {
      return new Promise((resolve, reject) => {
        const isVideo = file.type.startsWith('video') || file.name.match(/\.(mp4|mov|webm|mkv)$/i);
        const maxSize = isVideo ? MAX_VIDEO_SIZE_BYTES : MAX_IMAGE_SIZE_BYTES;
        const maxMB = isVideo ? 100 : 10;

        if (file.size > maxSize) {
          const actualMB = (file.size / (1024 * 1024)).toFixed(1);
          reject(new Error(`File "${file.name}" is ${actualMB} MB, which exceeds Cloudinary free tier limit (${maxMB} MB).`));
          return;
        }

        const xhr = new XMLHttpRequest();
        xhr.open('POST', CLOUDINARY_API_URL);

        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable && onProgress) {
            const percent = Math.round((e.loaded / e.total) * 100);
            onProgress(percent);
          }
        };

        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              const res = JSON.parse(xhr.responseText);
              const secureUrl = res.secure_url;
              let thumbUrl = secureUrl;
              if (isVideo) {
                // Cloudinary automatic video poster thumbnail
                thumbUrl = secureUrl.replace(/\.[^/.]+$/, '.jpg');
              }
              resolve({
                url: secureUrl,
                thumbnail: thumbUrl,
                publicId: res.public_id,
                resourceType: res.resource_type || (isVideo ? 'video' : 'image'),
                format: res.format,
                bytes: res.bytes
              });
            } catch (err) {
              reject(new Error('Invalid response from Cloudinary.'));
            }
          } else {
            let errMsg = `Upload failed (Status ${xhr.status})`;
            try {
              const errRes = JSON.parse(xhr.responseText);
              if (errRes.error && errRes.error.message) {
                errMsg = errRes.error.message;
              }
            } catch (e) {}
            reject(new Error(errMsg));
          }
        };

        xhr.onerror = () => {
          reject(new Error('Network error uploading to Cloudinary. Check your internet connection.'));
        };

        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
        xhr.send(formData);
      });
    }

    function Toast({ message, visible }) {
      return <div className={`toast ${visible ? 'show' : ''}`}>{message}</div>;
    }

    // ── Main App Component ────────────────────────────────────────
    function App() {
      const [appReady, setAppReady] = useState(false);
      const [user, setUser] = useState(null);
      const [cloudStatus, setCloudStatus] = useState('offline');
      const [episodes, setEpisodes] = useState([]);
      const [view, setView] = useState('locked');
      const [currentEpisode, setCurrentEpisode] = useState(null);
      const [siteSettings, setSiteSettings] = useState({
        viewerPin: '0000',
        adminPin: '1234',
        bannerImage: 'https://images.unsplash.com/photo-1518133910546-b6c2fb7d79e3?q=80&w=2000&auto=format&fit=crop',
        bannerBlobId: null,
        heroTitle: 'Our Story',
        heroSubtitle: 'Every moment, captured and kept forever. Relive our favorite memories.'
      });
      const [enteredPin, setEnteredPin] = useState('');
      const [pinError, setPinError] = useState('');
      const [toast, setToast] = useState({ message: '', visible: false });

      const showToast = useCallback((msg) => {
        setToast({ message: msg, visible: true });
        setTimeout(() => setToast(t => ({ ...t, visible: false })), 2600);
      }, []);

      // 1. Initial Load from local IndexedDB
      useEffect(() => {
        async function loadLocalData() {
          try {
            const savedSettings = await idbGetSettings();
            if (savedSettings) {
              if (savedSettings.bannerBlobId) {
                const blob = await idbGetMediaBlob(savedSettings.bannerBlobId);
                if (blob) {
                  savedSettings.bannerImage = URL.createObjectURL(blob);
                }
              }
              setSiteSettings(s => ({ ...s, ...savedSettings }));
            }
            const savedEps = await idbGetEpisodes();
            if (savedEps && savedEps.length > 0) {
              savedEps.sort((a, b) => {
                const numA = parseInt((a.title || '').replace('EP ', '')) || 0;
                const numB = parseInt((b.title || '').replace('EP ', '')) || 0;
                return numA - numB;
              });
              setEpisodes(savedEps);
            }
          } catch (e) {
            console.warn('Error loading local data:', e);
          } finally {
            setAppReady(true);
          }
        }
        loadLocalData();
      }, []);

      // 2. Firebase Cloud Listener
      useEffect(() => {
        if (!window.__firebaseAuth || !window.__firebaseModules) return;
        const { signInAnonymously, onAuthStateChanged, collection, doc, onSnapshot } = window.__firebaseModules;
        const auth = window.__firebaseAuth;
        const db = window.__firebaseDb;
        const appId = window.__appId;

        signInAnonymously(auth)
          .then(() => setCloudStatus('connected'))
          .catch(err => {
            console.warn('Firebase Anonymous Auth:', err.message);
            setCloudStatus('offline');
          });

        const unsubAuth = onAuthStateChanged(auth, u => {
          setUser(u);
          if (u && db) {
            setCloudStatus('connected');
            const epRef = collection(db, 'artifacts', appId, 'public', 'data', 'episodes');
            const unsubEp = onSnapshot(epRef, async (snap) => {
              if (!snap.empty) {
                const cloudEps = [];
                snap.forEach(d => cloudEps.push({ id: d.id, ...d.data() }));
                cloudEps.sort((a, b) => {
                  const numA = parseInt((a.title || '').replace(/[^0-9]/g, '')) || 0;
                  const numB = parseInt((b.title || '').replace(/[^0-9]/g, '')) || 0;
                  return numA - numB;
                });

                const hydrated = await Promise.all(cloudEps.map(async (cEp) => {
                  const localEp = await idbGetEpisodeById(cEp.id);
                  let thumbnail = cEp.thumbnail || (localEp && localEp.thumbnail) || '';
                  if (localEp && localEp.thumbBlobId && !thumbnail) {
                    const blob = await idbGetMediaBlob(localEp.thumbBlobId);
                    if (blob) thumbnail = URL.createObjectURL(blob);
                  }

                  const media = await Promise.all((cEp.media || []).map(async (cm, idx) => {
                    const lm = localEp?.media?.[idx];
                    let url = cm.url || (lm && lm.url) || '';
                    const blobId = lm?.blobId || cm?.blobId;
                    const fileName = lm?.name || lm?._name || cm?.name || '';
                    if (!url && blobId) {
                      const blob = await idbGetMediaBlob(blobId);
                      if (blob) url = URL.createObjectURL(blob);
                    }
                    if (!url && fileName) {
                      url = `media/${fileName}`;
                    }
                    return {
                      ...cm,
                      ...lm,
                      url,
                      blobId: blobId || null,
                      _name: fileName,
                      name: fileName
                    };
                  }));

                  return {
                    ...cEp,
                    ...localEp,
                    thumbnail,
                    media
                  };
                }));

                setEpisodes(hydrated);
              }
            }, err => console.warn('Firestore sync:', err.message));

            const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config');
            const unsubSettings = onSnapshot(settingsRef, snap => {
              if (snap.exists()) {
                const cloudData = snap.data();
                setSiteSettings(s => {
                  const bannerImage = (cloudData.bannerImage && cloudData.bannerImage.startsWith('http'))
                    ? cloudData.bannerImage
                    : (s.bannerBlobId ? s.bannerImage : (cloudData.bannerImage || s.bannerImage));
                  return { ...s, ...cloudData, bannerImage };
                });
              }
            }, err => console.warn('Firestore settings:', err.message));

            return () => { unsubEp(); unsubSettings(); };
          }
        });

        return () => unsubAuth();
      }, []);

      const handleLogin = (e) => {
        e.preventDefault();
        const pin = enteredPin.trim();
        if (pin === siteSettings.adminPin) {
          setView('admin');
          setPinError('');
        } else if (pin === siteSettings.viewerPin || pin === '0000' || pin === '') {
          setView('home');
          setPinError('');
        } else {
          setPinError('Incorrect PIN. Please try again.');
        }
      };

      if (!appReady) return <div className="loader">US</div>;

      return (
        <>
          {view === 'locked' && (
            <LockScreen
              enteredPin={enteredPin}
              setEnteredPin={setEnteredPin}
              pinError={pinError}
              handleLogin={handleLogin}
            />
          )}
          {view === 'home' && (
            <HomeScreen
              episodes={episodes}
              siteSettings={siteSettings}
              setView={setView}
              setCurrentEpisode={setCurrentEpisode}
            />
          )}
          {view === 'player' && (
            <PlayerScreen
              episodes={episodes}
              currentEpisode={currentEpisode}
              setCurrentEpisode={setCurrentEpisode}
              setView={setView}
            />
          )}
          {view === 'admin' && (
            <AdminScreen
              episodes={episodes}
              setEpisodes={setEpisodes}
              siteSettings={siteSettings}
              setSiteSettings={setSiteSettings}
              cloudStatus={cloudStatus}
              setView={setView}
              showToast={showToast}
            />
          )}
          <Toast message={toast.message} visible={toast.visible} />
        </>
      );
    }

    // ── Lock Screen ───────────────────────────────────────────────
    function LockScreen({ enteredPin, setEnteredPin, pinError, handleLogin }) {
      return (
        <div className="lock-screen fade-in">
          <div className="lock-logo">US</div>
          <form onSubmit={handleLogin} className="lock-form">
            <h2>Enter Access PIN</h2>

              id="pin-input"

              placeholder="••••"
              className="pin-input"
              value={enteredPin}
              onChange={e => setEnteredPin(e.target.value)}
              autoFocus
            />
            {pinError && <p className="pin-error">{pinError}</p>}
            <button type="submit" className="btn-enter">Enter</button>
            <p className="lock-hint">
              Default Viewer PIN: <strong>0000</strong> &nbsp;|&nbsp; Admin PIN: <strong>1234</strong>
            </p>
          </form>
        </div>
      );
    }

    function HomeScreen({ episodes, siteSettings, setView, setCurrentEpisode }) {
      const bannerUrl = siteSettings.bannerImage || "https://images.unsplash.com/photo-1518133910546-b6c2fb7d79e3?q=80&w=2000&auto=format&fit=crop";
      const heroTitle = siteSettings.heroTitle || "Our Story";
      const heroSubtitle = siteSettings.heroSubtitle || "Every moment, captured and kept forever. Relive our favorite memories.";
      return (
        <div style={{ minHeight: '100vh', background: '#000', color: '#fff', overflowX: 'hidden', paddingBottom: '4rem' }}>
          <nav className="navbar">
            <div className="nav-logo">US</div>
            <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
              <button className="btn-action-small" onClick={() => setView('admin')} title="Open Studio Admin">
                <SettingsIcon size={16} /> Studio
              </button>
              <button className="nav-btn" onClick={() => setView('locked')} title="Lock Screen">
                <LockIcon size={18} />
              </button>
            </div>
          </nav>
          <div className="hero">
            <img
              className="hero-img"
              src={bannerUrl}
              alt="Banner"
              onError={(e) => {
                e.target.onerror = null;
                e.target.src = "https://images.unsplash.com/photo-1518133910546-b6c2fb7d79e3?q=80&w=2000&auto=format&fit=crop";
              }}
            />
            <div className="hero-gradient" />
            <div className="hero-content fade-in">
              <h1 className="hero-title">{heroTitle}</h1>
              <p className="hero-subtitle">{heroSubtitle}</p>
              {episodes.length > 0 && (
                <button className="btn-play" onClick={() => { setCurrentEpisode(episodes[0]); setView('player'); }}>
                  <PlayIcon size={22} /> Play First Episode
                </button>
              )}
            </div>
          </div>
          <div className="episodes-section">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
              <h2 className="section-title" style={{ marginBottom: 0 }}>Episodes</h2>
              {episodes.length > 0 && (
                <span style={{ fontSize: '0.85rem', color: '#71717a' }}>{episodes.length} Episode{episodes.length !== 1 ? 's' : ''}</span>
              )}
            </div>
            {episodes.length === 0 ? (
              <div style={{ textAlign: 'center', padding: '3rem 1.5rem', background: '#121214', borderRadius: '12px', border: '1px solid #27272a' }}>
                <p style={{ color: '#a1a1aa', marginBottom: '1rem', fontSize: '1.05rem' }}>No episodes added yet.</p>
                <button className="btn-action-small" onClick={() => setView('admin')} style={{ padding: '0.6rem 1.25rem', fontSize: '0.9rem' }}>

                </button>
              </div>

              <div className="episodes-row scrollbar-hide">
                {episodes.map(ep => (
                  <div key={ep.id} className="episode-card" onClick={() => { setCurrentEpisode(ep); setView('player'); }}>
                    <div className="ep-thumb">
                      {ep.thumbnail ? <img src={ep.thumbnail} alt={ep.title} /> : <div className="ep-thumb-placeholder"><ImageIcon size={36} /></div>}
                      <div className="ep-overlay"><span className="ep-play-icon"><PlayIcon size={48} /></span></div>
                    </div>
                    <p className="ep-title">{ep.title}</p>
                    <p style={{ fontSize: '0.75rem', color: '#71717a', marginTop: '0.2rem' }}>
                      {(ep.media || []).length} moment{(ep.media || []).length !== 1 ? 's' : ''}

    }

    // ── Player Screen ─────────────────────────────────────────────
    function PlayerScreen({ episodes, currentEpisode, setCurrentEpisode, setView }) {
      const [mediaIndex, setMediaIndex] = useState(0);
      const media = currentEpisode?.media || [];
      const currentMedia = media[mediaIndex];

      const handleNext = useCallback(() => {
        if (mediaIndex < media.length - 1) {
          setMediaIndex(i => i + 1);
        } else {
          const idx = episodes.findIndex(e => e.id === currentEpisode.id);
          if (idx >= 0 && idx < episodes.length - 1) {
            setCurrentEpisode(episodes[idx + 1]);
            setMediaIndex(0);
          } else {
            setView('home');
          }
        }
      }, [mediaIndex, media, episodes, currentEpisode, setCurrentEpisode, setView]);

      const handlePrev = useCallback(() => {
        if (mediaIndex > 0) setMediaIndex(i => i - 1);
      }, [mediaIndex]);

      useEffect(() => {
        const handler = (e) => {
          if (e.key === 'ArrowRight') handleNext();
          if (e.key === 'ArrowLeft') handlePrev();
          if (e.key === 'Escape') setView('home');
        };
        window.addEventListener('keydown', handler);
        return () => window.removeEventListener('keydown', handler);
      }, [mediaIndex, currentEpisode, handleNext, handlePrev, setView]);

      if (!currentEpisode || media.length === 0) {
        return (
          <div className="player-screen" style={{ flexDirection: 'column', gap: '1rem' }}>
            <p style={{ color: '#71717a' }}>No media found in this episode.</p>
            <button className="btn-secondary" onClick={() => setView('home')}>
              <ChevronLeftIcon size={16} /> Return to Home
            </button>
          </div>
        );
      }

      return (
        <div className="player-screen">
          <div className="player-controls">
            <button className="player-back-btn" onClick={() => setView('home')} title="Exit (Esc)">
              <ChevronLeftIcon size={32} />
            </button>
            <div className="player-info">
              <h2>{currentEpisode.title}</h2>
              <p>{mediaIndex + 1} of {media.length}</p>
            </div>
            <div style={{ width: '2.25rem' }} />
          </div>
          <div className="player-media">
            {currentMedia.type === 'video' ? (
              <video
                key={currentMedia.url}
                src={currentMedia.url}
                controls
                autoPlay
                playsInline
                onEnded={handleNext}
                style={{ width: '100%', height: '100%', maxHeight: '85vh', objectFit: 'contain' }}
              />
            ) : (
              <img
                key={currentMedia.url}
                src={currentMedia.url}
                alt="Memory"
                style={{ width: '100%', height: '100%', maxHeight: '85vh', objectFit: 'contain' }}
              />
            )}
          </div>
          {currentMedia.caption && (
            <div className="player-caption">
              <p>“{currentMedia.caption}”</p>
            </div>
          )}
          {mediaIndex > 0 && (
            <button className="player-nav-btn player-nav-prev" onClick={handlePrev} title="Previous (Left Arrow)">
              <ChevronLeftIcon size={28} />
            </button>
          )}
          <button className="player-nav-btn player-nav-next" onClick={handleNext} title="Next (Right Arrow)">
            <ChevronRightIcon size={28} />
          </button>
        </div>
      );
    }

    // ── Admin Screen ──────────────────────────────────────────────
    function AdminScreen({ episodes, setEpisodes, siteSettings, setSiteSettings, cloudStatus, setView, showToast }) {
      const [editingEp, setEditingEp] = useState(null);
      const [epForm, setEpForm] = useState({ title: '', thumbnail: '', thumbBlobId: null, media: [] });
      const [saving, setSaving] = useState(false);
      const [thumbDrag, setThumbDrag] = useState(false);
      const [bannerDrag, setBannerDrag] = useState(false);
      const [bannerUploading, setBannerUploading] = useState(false);
      const fileInputRef = useRef(null);
      const bannerInputRef = useRef(null);
      const appId = window.__appId || 'us-memories-app';

      // ── Hero Banner upload (Cloudinary + Firestore) ─────────────
      const handleBannerFile = async (file) => {
        if (!file || !file.type.startsWith('image')) {
          showToast('Please select an image file (JPG, PNG, WebP) for the banner');
          return;
        }
        setBannerUploading(true);
        showToast('Uploading banner to Cloudinary...');
        try {
          const res = await uploadFileToCloudinary(file);
          const updatedSettings = {
            ...siteSettings,
            bannerImage: res.url,
            bannerBlobId: null
          };
          setSiteSettings(updatedSettings);
          await idbSaveSettings(updatedSettings);

          if (window.__firebaseDb && window.__firebaseModules) {
            const { doc, setDoc } = window.__firebaseModules;
            await setDoc(doc(window.__firebaseDb, 'artifacts', appId, 'public', 'data', 'settings', 'config'), {
              ...updatedSettings,
              bannerImage: res.url
            });
          }
          showToast('✓ Custom banner uploaded to Cloudinary & saved!');
        } catch (e) {
          console.error('handleBannerFile error:', e);
          showToast('Banner upload failed: ' + e.message);
        } finally {
          setBannerUploading(false);
        }
      };

      // ── Thumbnail upload (Cloudinary) ─────────────────────────
      const handleThumbFile = async (file) => {
        if (!file || !file.type.startsWith('image')) {
          showToast('Please select an image for thumbnail');
          return;
        }
        showToast('Uploading cover thumbnail to Cloudinary...');
        try {
          const res = await uploadFileToCloudinary(file);
          setEpForm(f => ({ ...f, thumbnail: res.url, thumbBlobId: null }));
          showToast('✓ Cover photo uploaded to Cloudinary!');
        } catch (e) {
          console.error(e);
          showToast('Thumbnail upload failed: ' + e.message);
        }
      };

      // ── Media files upload directly to Cloudinary ─────────────
      const handleMediaFiles = async (files) => {
        const fileArr = Array.from(files);
        if (fileArr.length === 0) return;

        showToast(`Preparing ${fileArr.length} file${fileArr.length > 1 ? 's' : ''} for Cloudinary upload...`);

        for (const file of fileArr) {
          const isVideo = file.type.startsWith('video') || file.name.match(/\.(mp4|mov|webm|mkv)$/i);
          const type = isVideo ? 'video' : 'image';
          const tempUrl = URL.createObjectURL(file);
          const tempId = `media_${Date.now()}_${Math.random().toString(36).substring(2, 7)}`;

          const newItem = {
            _id: tempId,
            type,
            url: tempUrl,
            _tempUrl: tempUrl,
            caption: '',
            _name: file.name,
            name: file.name,
            _uploading: true,
            _progress: 0,
            _error: null,
            _permanent: false
          };

          setEpForm(f => ({ ...f, media: [...f.media, newItem] }));

          // Upload to Cloudinary immediately
          uploadFileToCloudinary(file, (percent) => {
            setEpForm(f => {
              const updated = f.media.map(m => {
                if (m._id === tempId) {
                  return { ...m, _progress: percent };
                }
                return m;
              });
              return { ...f, media: updated };
            });
          }).then(res => {
            // Upload successful! Got permanent HTTPS URL!
            setEpForm(f => {
              const updated = f.media.map(m => {
                if (m._id === tempId) {
                  return {
                    ...m,
                    url: res.url,
                    thumbnail: res.thumbnail,
                    _uploading: false,
                    _progress: 100,
                    _permanent: true,
                    _error: null
                  };
                }
                return m;
              });
              let newThumb = f.thumbnail;
              if (!newThumb || newThumb.startsWith('blob:')) {
                newThumb = res.thumbnail;
              }
              return { ...f, thumbnail: newThumb, media: updated };
            });
            showToast(`✓ "${file.name}" uploaded to Cloudinary!`);
          }).catch(err => {
            setEpForm(f => {
              const updated = f.media.map(m => {
                if (m._id === tempId) {
                  return { ...m, _uploading: false, _error: err.message };
                }
                return m;
              });
              return { ...f, media: updated };
            });
            showToast(`⚠️ Upload failed: ${err.message}`);
          });
        }
      };

      const updateCaption = (idx, val) => {
        setEpForm(f => {
          const m = [...f.media];
          m[idx] = { ...m[idx], caption: val };
          return { ...f, media: m };
        });
      };

      const removeMedia = (idx) => {
        setEpForm(f => {
          const m = [...f.media];
          m.splice(idx, 1);
          return { ...f, media: m };
        });
      };

      const moveMedia = (idx, dir) => {
        setEpForm(f => {
          const m = [...f.media];
          const target = idx + dir;
          if (target < 0 || target >= m.length) return f;
          [m[idx], m[target]] = [m[target], m[idx]];
          return { ...f, media: m };
        });
      };

      // ── Save Episode ──────────────────────────────────────────
      const handleSaveEpisode = async () => {
        if (!epForm.title.trim() && epForm.media.length === 0) {
          showToast('Please add at least one photo or video!');
          return;
        }

        // Check if any items are actively uploading to Cloudinary
        const stillUploading = epForm.media.some(m => m._uploading);
        if (stillUploading) {
          showToast('⏳ Upload in progress! Please wait until Cloudinary upload finishes...');
          return;
        }

        // Safety verification: Ensure no temporary blob URLs remain
        const hasUnuploadedBlobs = epForm.media.some(m => m.url && m.url.startsWith('blob:') && !m._permanent);
        if (hasUnuploadedBlobs) {
          showToast('⚠️ Some files could not be uploaded to Cloudinary. Please retry uploading them.');
          return;
        }

        setSaving(true);
        try {
          const docId = editingEp ? editingEp.id : `ep-${Date.now()}`;
          const finalTitle = epForm.title.trim() || `EP ${episodes.length + 1}`;
          
          let finalThumb = epForm.thumbnail || '';
          if (!finalThumb && epForm.media.length > 0) {
            const firstWithThumb = epForm.media.find(m => m.thumbnail || (m.url && !m.url.startsWith('blob:')));
            if (firstWithThumb) {
              finalThumb = firstWithThumb.thumbnail || firstWithThumb.url;
            }
          }

          // Safety check: Never save blob URLs to Firestore
          if (finalThumb.startsWith('blob:')) {
            const safeMedia = epForm.media.find(m => m.url && !m.url.startsWith('blob:'));
            finalThumb = safeMedia ? (safeMedia.thumbnail || safeMedia.url) : '';
          }

          const newEp = {
            id: docId,
            title: finalTitle,
            thumbnail: finalThumb || '',
            media: epForm.media.map(m => ({
              type: m.type,
              url: m.url || '',
              caption: m.caption || '',
              name: m.name || m._name || ''
            }))
          };

          // 1. Save locally to IndexedDB
          await idbSaveEpisode(newEp);

          // 2. Save permanent HTTPS URLs directly to Firebase Firestore
          if (window.__firebaseDb && window.__firebaseModules) {
            try {
              const { doc, setDoc } = window.__firebaseModules;
              await setDoc(doc(window.__firebaseDb, 'artifacts', appId, 'public', 'data', 'episodes', docId), {
                title: newEp.title,
                thumbnail: newEp.thumbnail || '',
                media: newEp.media.map(m => ({
                  type: m.type,
                  url: m.url || '',
                  caption: m.caption || '',
                  name: m.name || ''
                }))
              });
            } catch (fbErr) {
              console.warn('Firestore sync warning:', fbErr.message);
            }
          }

          // 3. Update React State
          setEpisodes(prev => {
            const idx = prev.findIndex(e => e.id === docId);
            if (idx >= 0) {
              const updated = [...prev];
              updated[idx] = newEp;
              return updated;
            }
            return [...prev, newEp];
          });

          setEditingEp(null);
          setEpForm({ title: '', thumbnail: '', thumbBlobId: null, media: [] });
          showToast(editingEp ? '✓ Episode updated with permanent cloud URLs!' : '🚀 Episode published to Cloudinary & Firestore!');
        } catch (err) {
          console.error(err);
          showToast('Error saving: ' + err.message);
        } finally {
          setSaving(false);
        }
      };

      // ── Delete Episode ────────────────────────────────────────
      const handleDelete = async (id) => {
        if (!confirm('Are you sure you want to delete this episode?')) return;
        try {
          await idbDeleteEpisode(id);
          setEpisodes(prev => prev.filter(e => e.id !== id));
          if (window.__firebaseDb && window.__firebaseModules) {
            try {
              const { doc, deleteDoc } = window.__firebaseModules;
              await deleteDoc(doc(window.__firebaseDb, 'artifacts', appId, 'public', 'data', 'episodes', id));
            } catch (e) {}
          }
          showToast('Episode deleted.');
        } catch (e) {
          console.error(e);
          showToast('Error deleting episode.');
        }
      };

      // ── Save Settings ─────────────────────────────────────────
      const saveSettings = async () => {
        try {
          await idbSaveSettings(siteSettings);
          if (window.__firebaseDb && window.__firebaseModules) {
            try {
              const { doc, setDoc } = window.__firebaseModules;
              const cloudSettings = {
                viewerPin: siteSettings.viewerPin || '0000',
                adminPin: siteSettings.adminPin || '1234',
                bannerImage: (siteSettings.bannerImage && !siteSettings.bannerImage.startsWith('blob:')) ? siteSettings.bannerImage : '',
                heroTitle: siteSettings.heroTitle || 'Our Story',
                heroSubtitle: siteSettings.heroSubtitle || 'Every moment, captured and kept forever. Relive our favorite memories.'
              };
              await setDoc(doc(window.__firebaseDb, 'artifacts', appId, 'public', 'data', 'settings', 'config'), cloudSettings);
            } catch (e) {}
          }
          showToast('✓ Settings & PINs saved!');
        } catch (e) {
          console.error(e);
          showToast('Error saving settings');
        }
      };

      // ── Load Sample Demo Episode ──────────────────────────────
      const handleAddDemoEpisode = async () => {
        const demoEp = {
          id: `ep-demo-${Date.now()}`,
          title: `EP ${episodes.length + 1} — Our First Journey`,
          thumbnail: 'https://images.unsplash.com/photo-1518133910546-b6c2fb7d79e3?q=80&w=800&auto=format&fit=crop',
          thumbBlobId: null,
          media: [
            {
              type: 'image',
              url: 'https://images.unsplash.com/photo-1518133910546-b6c2fb7d79e3?q=80&w=1600&auto=format&fit=crop',
              caption: 'The golden hour when we talked for hours without looking at the time 💕'
            },
            {
              type: 'image',
              url: 'https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?q=80&w=1600&auto=format&fit=crop',
              caption: 'Making wishes under the city lights ✨'
            },
            {
              type: 'image',
              url: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1600&auto=format&fit=crop',
              caption: 'Always and forever by your side ❤️'
            }
          ]
        };

        await idbSaveEpisode(demoEp);
        setEpisodes(prev => [...prev, demoEp]);
        showToast('✨ Sample Episode created! Click "View Site" to watch!');
      };

      // ── Export / Backup ───────────────────────────────────────
      const handleExportBackup = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ episodes, siteSettings }));
        const dlAnchor = document.createElement('a');
        dlAnchor.setAttribute("href", dataStr);
        dlAnchor.setAttribute("download", `us_memories_backup_${Date.now()}.json`);
        dlAnchor.click();
        showToast('✓ Backup exported!');
      };

      return (
        <div className="admin-screen fade-in">
          <div className="admin-inner">
            <div className="admin-header">
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', flexWrap: 'wrap' }}>
                <h1 className="admin-title"><SettingsIcon size={22} /> Studio Dashboard</h1>
                <span className="status-badge cloud" style={{ background: 'rgba(34,197,94,0.15)', color: '#4ade80', borderColor: 'rgba(34,197,94,0.3)' }}>☁️ Cloudinary: Active</span>
                {cloudStatus === 'connected' ? (
                  <span className="status-badge cloud">🔥 Firestore: Synced</span>
                ) : (
                  <span className="status-badge pending">🔥 Firestore: Connecting...</span>
                )}
              </div>
              <div style={{ display: 'flex', gap: '0.5rem', flexWrap: 'wrap' }}>
                <button className="btn-action-small" onClick={handleAddDemoEpisode} title="Add sample demo memories">
                  ✨ Demo Episode
                </button>
                <button className="btn-action-small" onClick={handleExportBackup} title="Export backup file">
                  💾 Export
                </button>
                <button className="btn-secondary" onClick={() => setView('home')}>
                  <HomeIcon size={16} /> View Site
                </button>
              </div>
            </div>

            <div className="admin-info-banner">
              <div>
                <strong>☁️ Cloudinary Permanent Storage Active:</strong> Videos (up to 100 MB) and photos (up to 10 MB) are uploaded directly to Cloudinary and permanently linked in Firestore. They remain visible on any laptop or phone forever!
              </div>
            </div>

            <div className="admin-grid">
              {/* LEFT: EPISODE LIST & SETTINGS */}
              <div style={{ display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
                <div className="admin-card">
                  <h2>Episodes ({episodes.length})</h2>
                  <div className="ep-list">
                    {episodes.length === 0 && (
                      <p className="empty-state">No episodes yet. Create your first one on the right or click "Demo Episode".</p>
                    )}
                    {episodes.map(ep => (
                      <div key={ep.id} className="ep-list-item">
                        <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: '170px' }}>
                          {ep.title}
                        </span>
                        <div className="ep-list-actions">
                          <button
                            className="btn-edit"
                            onClick={() => {
                              setEditingEp(ep);
                              setEpForm({
                                title: ep.title,
                                thumbnail: ep.thumbnail || '',
                                thumbBlobId: ep.thumbBlobId || null,
                                media: (ep.media || []).map(m => ({ ...m }))
                              });
                            }}
                          >
                            Edit
                          </button>
                          <button className="btn-delete" onClick={() => handleDelete(ep.id)}>
                            <TrashIcon size={15} />
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                  <button
                    className="btn-new-ep"
                    onClick={() => {
                      setEditingEp(null);
                      setEpForm({ title: `EP ${episodes.length + 1}`, thumbnail: '', thumbBlobId: null, media: [] });
                    }}
                  >
                    <PlusIcon size={16} /> New Episode
                  </button>
                </div>

                <div className="admin-card" style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <h2>Site Settings &amp; Banner</h2>
                    {siteSettings.bannerBlobId && (
                      <span className="status-badge local" style={{ fontSize: '.7rem' }}>✓ Custom Banner Active</span>
                    )}
                  </div>

                  {/* Banner Image Customizer */}
                  <div className="form-group" style={{ marginBottom: 0 }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '.4rem' }}>
                      <label className="form-label" style={{ marginBottom: 0, fontWeight: 600 }}>Hero Banner Photo</label>
                      <button
                        type="button"
                        onClick={() => {
                          const defaultUrl = 'https://images.unsplash.com/photo-1518133910546-b6c2fb7d79e3?q=80&w=2000&auto=format&fit=crop';
                          const reset = { ...siteSettings, bannerImage: defaultUrl, bannerBlobId: null };
                          setSiteSettings(reset);
                          idbSaveSettings(reset);
                          showToast('Banner reset to default');
                        }}
                        style={{ background: 'transparent', border: 'none', color: '#f87171', fontSize: '.75rem', cursor: 'pointer', textDecoration: 'underline' }}
                      >
                        Reset to default
                      </button>
                    </div>

                    {/* Banner Live Preview Box */}
                    <div style={{
                      position: 'relative',
                      width: '100%',
                      height: '120px',
                      borderRadius: '8px',
                      overflow: 'hidden',
                      marginBottom: '.65rem',
                      border: '1px solid #3f3f46',
                      background: '#18181b'
                    }}>
                      <img
                        src={siteSettings.bannerImage || 'https://images.unsplash.com/photo-1518133910546-b6c2fb7d79e3?q=80&w=2000&auto=format&fit=crop'}
                        alt="Banner Preview"
                        style={{ width: '100%', height: '100%', objectFit: 'cover' }}
                        onError={(e) => {
                          e.target.onerror = null;
                          e.target.src = 'https://images.unsplash.com/photo-1518133910546-b6c2fb7d79e3?q=80&w=2000&auto=format&fit=crop';
                        }}
                      />
                      <div style={{
                        position: 'absolute',
                        inset: 0,
                        background: 'linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 60%, transparent 100%)',
                        display: 'flex',
                        alignItems: 'flex-end',
                        padding: '.5rem .75rem'
                      }}>
                        <span style={{ fontSize: '.8rem', color: '#f4f4f5', fontWeight: 600, textShadow: '0 1px 3px rgba(0,0,0,0.8)' }}>
                          Preview: {siteSettings.heroTitle || 'Our Story'}
                        </span>
                      </div>
                    </div>

                    {/* Banner Upload Drop Zone */}
                    <div
                      className={`upload-zone${bannerDrag ? ' drag-over' : ''}`}
                      style={{ padding: '1rem .75rem', marginBottom: '.65rem' }}
                      onDragOver={e => { e.preventDefault(); setBannerDrag(true); }}
                      onDragLeave={() => setBannerDrag(false)}
                      onDrop={e => {
                        e.preventDefault();
                        setBannerDrag(false);
                        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                          handleBannerFile(e.dataTransfer.files[0]);
                        }
                      }}
                    >
                      <input
                        ref={bannerInputRef}
                        type="file"
                        accept="image/*"
                        onChange={e => {
                          if (e.target.files && e.target.files[0]) {
                            handleBannerFile(e.target.files[0]);
                          }
                        }}
                      />
                      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '.5rem' }}>
                        <ImageIcon size={22} />
                        <p style={{ margin: 0 }}>
                          {bannerUploading ? 'Saving banner photo...' : <span><strong>Click or drag &amp; drop</strong> your banner photo</span>}
                        </p>
                      </div>
                      <p className="hint" style={{ margin: '.25rem 0 0 0' }}>JPG, PNG, WebP · High resolution recommended</p>
                    </div>

                    {/* Or URL input */}
                    <input
                      type="text"
                      className="form-input"
                      value={siteSettings.bannerImage || ''}
                      onChange={e => setSiteSettings(s => ({ ...s, bannerImage: e.target.value, bannerBlobId: null }))}
                      placeholder="Or paste an image link (https://...)"
                      style={{ fontSize: '.8rem' }}
                    />
                  </div>

                  {/* Hero Title & Subtitle Customization */}
                  <div className="settings-grid">
                    <div className="form-group" style={{ marginBottom: 0 }}>
                      <label className="form-label">Hero Title</label>
                      <input
                        type="text"
                        className="form-input"
                        placeholder="Our Story"
                        value={siteSettings.heroTitle || ''}
                        onChange={e => setSiteSettings(s => ({ ...s, heroTitle: e.target.value }))}
                      />
                    </div>
                    <div className="form-group" style={{ marginBottom: 0 }}>
                      <label className="form-label">Subtitle</label>
                      <input
                        type="text"
                        className="form-input"
                        placeholder="Every moment, captured..."
                        value={siteSettings.heroSubtitle || ''}
                        onChange={e => setSiteSettings(s => ({ ...s, heroSubtitle: e.target.value }))}
                      />
                    </div>
                  </div>

                  {/* PINs */}
                  <div className="settings-grid">
                    <div className="form-group" style={{ marginBottom: 0 }}>
                      <label className="form-label">Viewer PIN</label>
                      <input
                        type="text"
                        className="form-input"
                        style={{ textAlign: 'center', letterSpacing: '.2em' }}
                        value={siteSettings.viewerPin || ''}
                        onChange={e => setSiteSettings(s => ({ ...s, viewerPin: e.target.value }))}
                      />
                    </div>
                    <div className="form-group" style={{ marginBottom: 0 }}>
                      <label className="form-label">Admin PIN</label>
                      <input
                        type="text"
                        className="form-input"
                        style={{ textAlign: 'center', letterSpacing: '.2em' }}
                        value={siteSettings.adminPin || ''}
                        onChange={e => setSiteSettings(s => ({ ...s, adminPin: e.target.value }))}
                      />
                    </div>
                  </div>
                  <button className="btn-save-settings" onClick={saveSettings}>Save Settings</button>
                </div>
              </div>

              {/* RIGHT: EPISODE EDITOR */}
              <div className="admin-card">
                <h2 style={{ borderBottom: '1px solid #27272a', paddingBottom: '.75rem', marginBottom: '1.25rem', fontSize: '1.15rem' }}>
                  {editingEp ? `✏️ Edit: ${editingEp.title}` : '➕ Create Episode'}
                </h2>

                {/* Episode Title */}
                <div className="form-group">
                  <label className="form-label">Episode Title</label>
                  <input
                    type="text"
                    className="form-input"
                    placeholder="EP 1 — Our Beginning"
                    value={epForm.title}
                    onChange={e => setEpForm(f => ({ ...f, title: e.target.value }))}
                  />
                </div>

                {/* Thumbnail */}
                <div className="form-group">
                  <label className="form-label">Cover / Thumbnail</label>
                  <div className="thumb-row">
                    <div className="thumb-prev">
                      {epForm.thumbnail ? (
                        <img src={epForm.thumbnail} alt="Cover Preview" />
                      ) : (
                        <ImageIcon size={22} />
                      )}
                    </div>
                    <div style={{ flex: 1 }}>
                      <div
                        className={`upload-zone${thumbDrag ? ' drag-over' : ''}`}
                        style={{ padding: '.65rem', marginBottom: '.4rem' }}
                        onDragOver={e => { e.preventDefault(); setThumbDrag(true); }}
                        onDragLeave={() => setThumbDrag(false)}
                        onDrop={e => {
                          e.preventDefault();
                          setThumbDrag(false);
                          if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                            handleThumbFile(e.dataTransfer.files[0]);
                          }
                        }}
                      >
                        <input
                          type="file"
                          accept="image/*"
                          onChange={e => e.target.files && handleThumbFile(e.target.files[0])}
                        />
                        <p><strong>Click or drag</strong> thumbnail photo</p>
                      </div>
                      <input
                        type="text"
                        className="form-input"
                        placeholder="Or paste an image link (https://...)"
                        value={epForm.thumbnail}
                        onChange={e => setEpForm(f => ({ ...f, thumbnail: e.target.value, thumbBlobId: null }))}
                        style={{ fontSize: '.8rem' }}
                      />
                    </div>
                  </div>
                </div>

                {/* Media Upload Area */}
                <div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '.6rem' }}>
                    <label className="form-label" style={{ marginBottom: 0 }}>Videos &amp; Photos</label>
                    <span style={{ fontSize: '.75rem', color: '#a1a1aa', background: '#27272a', padding: '.15rem .6rem', borderRadius: '100px' }}>
                      {epForm.media.length} item{epForm.media.length !== 1 ? 's' : ''}
                    </span>
                  </div>

                  {/* Drop zone */}
                  <div
                    className="upload-zone"
                    style={{ marginBottom: '1rem', padding: '1.75rem 1rem' }}
                    onDragOver={e => { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }}
                    onDragLeave={e => e.currentTarget.classList.remove('drag-over')}
                    onDrop={e => {
                      e.preventDefault();
                      e.currentTarget.classList.remove('drag-over');
                      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                        handleMediaFiles(e.dataTransfer.files);
                      }
                    }}
                  >
                    <input
                      ref={fileInputRef}
                      type="file"
                      accept="video/*,image/*"
                      multiple
                      onChange={e => {
                        if (e.target.files && e.target.files.length > 0) {
                          handleMediaFiles(e.target.files);
                        }
                      }}
                    />
                    <div className="upload-zone-icon">🎬</div>
                    <p style={{ fontSize: '0.95rem', marginBottom: '0.2rem' }}>
                      <strong>Click or Drag &amp; Drop</strong> your videos and photos here
                    </p>
                    <p className="hint">MP4, MOV, WebM, JPG, PNG · Select multiple at once</p>
                  </div>

                  {/* Media items list */}
                  {epForm.media.length === 0 ? (
                    <div style={{ textAlign: 'center', padding: '1.5rem', color: '#52525b', fontSize: '.85rem', border: '1px dashed #27272a', borderRadius: '8px' }}>
                      Drop your videos above — they will show up here instantly with live video playback!
                    </div>
                  ) : (
                    <div className="media-list" style={{ maxHeight: '440px', overflowY: 'auto', paddingRight: '4px' }}>
                      {epForm.media.map((m, idx) => (
                        <div key={m._id || idx} className="media-item">
                          <div className="media-item-header">
                            <span className="media-num">{idx + 1}</span>
                            <span className={`type-badge ${m.type === 'video' ? 'badge-video' : 'badge-image'}`}>
                              {m.type === 'video' ? '▶ Video' : '🖼 Image'}
                            </span>
                            {m._name && <span className="file-name">{m._name}</span>}
                            {m.url && !m.url.startsWith('blob:') && (
                              <span style={{ fontSize: '.7rem', color: '#4ade80', background: 'rgba(34,197,94,0.12)', border: '1px solid rgba(34,197,94,0.25)', padding: '.15rem .45rem', borderRadius: '4px' }}>
                                ☁️ Cloud
                              </span>
                            )}
                          </div>

                          {/* Upload Progress Bar */}
                          {m._uploading && (
                            <div style={{ margin: '.5rem 0', background: '#09090b', padding: '.5rem .75rem', borderRadius: '6px', border: '1px solid #27272a' }}>
                              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '.75rem', marginBottom: '.3rem', color: '#a1a1aa' }}>
                                <span>Uploading to Cloudinary...</span>
                                <span style={{ fontWeight: 700, color: '#dc2626' }}>{m._progress || 0}%</span>
                              </div>
                              <div style={{ height: '5px', background: '#27272a', borderRadius: '100px', overflow: 'hidden' }}>
                                <div style={{ height: '100%', background: '#dc2626', width: `${m._progress || 0}%`, transition: 'width 0.2s' }} />
                              </div>
                            </div>
                          )}

                          {/* Upload Error Banner & Retry */}
                          {m._error && (
                            <div style={{ background: 'rgba(239,68,68,0.12)', border: '1px solid #ef4444', borderRadius: '6px', padding: '.5rem .75rem', margin: '.5rem 0' }}>
                              <p style={{ color: '#fca5a5', fontSize: '.78rem', marginBottom: '.3rem' }}>
                                ⚠️ {m._error}
                              </p>
                              <label className="btn-action-small" style={{ cursor: 'pointer', background: '#dc2626', color: '#fff', border: 'none', fontSize: '.72rem', padding: '.25rem .6rem' }}>
                                🔄 Retry Upload
                                <input
                                  type="file"
                                  accept={m.type === 'video' ? 'video/*' : 'image/*'}
                                  style={{ display: 'none' }}
                                  onChange={e => {
                                    if (e.target.files && e.target.files[0]) {
                                      const file = e.target.files[0];
                                      setEpForm(f => {
                                        const updated = [...f.media];
                                        updated[idx] = { ...updated[idx], _uploading: true, _progress: 0, _error: null, _name: file.name, name: file.name };
                                        return { ...f, media: updated };
                                      });
                                      uploadFileToCloudinary(file, (p) => {
                                        setEpForm(f => {
                                          const updated = [...f.media];
                                          if (updated[idx]) updated[idx]._progress = p;
                                          return { ...f, media: updated };
                                        });
                                      }).then(res => {
                                        setEpForm(f => {
                                          const updated = [...f.media];
                                          if (updated[idx]) {
                                            updated[idx] = { ...updated[idx], url: res.url, thumbnail: res.thumbnail, _uploading: false, _progress: 100, _permanent: true, _error: null };
                                          }
                                          return { ...f, media: updated };
                                        });
                                        showToast('✓ Uploaded to Cloudinary!');
                                      }).catch(err => {
                                        setEpForm(f => {
                                          const updated = [...f.media];
                                          if (updated[idx]) {
                                            updated[idx] = { ...updated[idx], _uploading: false, _error: err.message };
                                          }
                                          return { ...f, media: updated };
                                        });
                                        showToast('Upload error: ' + err.message);
                                      });
                                    }
                                  }}
                                />
                              </label>
                            </div>
                          )}

                          {/* Live preview or re-attach file button */}
                          {m.url ? (
                            <div className="media-preview">
                              {m.type === 'video' ? (
                                <video
                                  src={m.url}
                                  controls
                                  playsInline
                                  style={{ width: '100%', height: '100%', objectFit: 'contain' }}
                                />
                              ) : (
                                <img src={m.url} alt="Memory item" style={{ width: '100%', height: '100%', objectFit: 'contain' }} />
                              )}
                            </div>
                          ) : (
                            <div style={{ background: '#18181b', border: '1px dashed #ef4444', borderRadius: '8px', padding: '1rem', marginBottom: '.6rem', textAlign: 'center' }}>
                              <p style={{ color: '#fca5a5', fontSize: '.82rem', marginBottom: '.5rem', fontWeight: 600 }}>
                                ⚠️ Cloud video not attached yet
                              </p>
                              <label className="btn-action-small" style={{ cursor: 'pointer', background: '#dc2626', color: '#fff', border: 'none', padding: '.45rem .85rem' }}>
                                ☁️ Upload to Cloudinary
                                <input
                                  type="file"
                                  accept="video/*,image/*"
                                  style={{ display: 'none' }}
                                  onChange={async (e) => {
                                    if (e.target.files && e.target.files[0]) {
                                      const file = e.target.files[0];
                                      const isVid = file.type.startsWith('video') || file.name.match(/\.(mp4|mov|webm|mkv)$/i);
                                      const tempUrl = URL.createObjectURL(file);
                                      setEpForm(f => {
                                        const updated = [...f.media];
                                        updated[idx] = { ...updated[idx], url: tempUrl, _uploading: true, _progress: 0, _error: null, _name: file.name, name: file.name, type: isVid ? 'video' : 'image' };
                                        return { ...f, media: updated };
                                      });
                                      showToast(`Uploading "${file.name}" to Cloudinary...`);
                                      uploadFileToCloudinary(file, (p) => {
                                        setEpForm(f => {
                                          const updated = [...f.media];
                                          if (updated[idx]) updated[idx]._progress = p;
                                          return { ...f, media: updated };
                                        });
                                      }).then(res => {
                                        setEpForm(f => {
                                          const updated = [...f.media];
                                          if (updated[idx]) {
                                            updated[idx] = { ...updated[idx], url: res.url, thumbnail: res.thumbnail, _uploading: false, _progress: 100, _permanent: true, _error: null };
                                          }
                                          let finalThumb = f.thumbnail;
                                          if (!finalThumb || finalThumb.startsWith('blob:')) {
                                            finalThumb = res.thumbnail;
                                          }
                                          return { ...f, thumbnail: finalThumb, media: updated };
                                        });
                                        showToast('✓ Uploaded to Cloudinary!');
                                      }).catch(err => {
                                        setEpForm(f => {
                                          const updated = [...f.media];
                                          if (updated[idx]) {
                                            updated[idx] = { ...updated[idx], _uploading: false, _error: err.message };
                                          }
                                          return { ...f, media: updated };
                                        });
                                        showToast('Upload error: ' + err.message);
                                      });
                                    }
                                  }}
                                />
                              </label>
                            </div>
                          )}

                          {/* Caption input */}
                          <textarea
                            className="media-caption"
                            rows={2}
                            placeholder="Add a sweet memory caption or love note... (optional)"
                            value={m.caption || ''}
                            onChange={e => updateCaption(idx, e.target.value)}
                          />

                          <div className="media-footer">
                            <div style={{ display: 'flex', gap: '.3rem' }}>
                              <button
                                className="btn-mv"
                                onClick={() => moveMedia(idx, -1)}
                                disabled={idx === 0}
                                title="Move Up"
                              >
                                ↑
                              </button>
                              <button
                                className="btn-mv"
                                onClick={() => moveMedia(idx, 1)}
                                disabled={idx === epForm.media.length - 1}
                                title="Move Down"
                              >
                                ↓
                              </button>
                            </div>
                            <button className="btn-rm" onClick={() => removeMedia(idx)}>
                              <TrashIcon size={13} /> Remove
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Publish Button */}
                <div style={{ marginTop: '1.5rem' }}>
                  <button
                    className="btn-publish"
                    onClick={handleSaveEpisode}
                    disabled={saving}
                  >
                    {saving ? (
                      <><div className="spinner" style={{ borderColor: 'rgba(255,255,255,.25)', borderTopColor: '#fff' }} /> Saving Episode...</>
                    ) : editingEp ? (
                      '✓ Update Episode'
                    ) : (
                      '🚀 Publish Episode'
                    )}
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ── Mount React Root ──────────────────────────────────────────
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
